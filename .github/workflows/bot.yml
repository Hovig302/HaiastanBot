name: Telegram Traducteur Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lancer le bot
        env:
          BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
          RECIPIENTS:     ${{ secrets.RECIPIENTS }}
          CHANNELS:       ${{ secrets.CHANNELS }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python main.py

      - name: Sauvegarder les GUIDs vus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_guids.json
          git diff --staged --quiet || git commit -m "update seen_guids"
          git push
